name: Sync LeetCode and Update README

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/update-readme.yml'
      - '.github/leetcode-sync-state.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync accepted LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_USERNAME: surajpokale
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          session = os.environ.get('LEETCODE_SESSION', '').strip()
          if not session:
              raise SystemExit('LEETCODE_SESSION is not configured.')

          headers = {
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://leetcode.com/',
              'Cookie': f'LEETCODE_SESSION={session}',
          }

          # LeetCode's submission REST endpoint is more stable for fetching
          # the actual submitted source code than the submissionDetails query.
          query = urlencode({'offset': 0, 'limit': 100})
          request = Request(
              f'https://leetcode.com/api/submissions/?{query}',
              headers=headers,
          )
          try:
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
          except HTTPError as exc:
              raise SystemExit(f'LeetCode submissions API returned HTTP {exc.code}. The LEETCODE_SESSION may be expired.')

          submissions = payload.get('submissions_dump') or payload.get('submissions') or []
          accepted = [s for s in submissions if str(s.get('status_display', '')).lower() == 'accepted']
          print(f'Fetched {len(submissions)} recent submissions; {len(accepted)} accepted.')

          state_path = Path('.github/leetcode-sync-state.json')
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state = json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {'submission_ids': []}
          processed = set(str(x) for x in state.get('submission_ids', []))

          extensions = {
              'python': '.py', 'python3': '.py', 'java': '.java',
              'cpp': '.cpp', 'c++': '.cpp', 'javascript': '.js', 'js': '.js',
              'typescript': '.ts', 'ts': '.ts', 'c': '.c',
              'csharp': '.cs', 'c#': '.cs', 'go': '.go', 'golang': '.go',
              'rust': '.rs', 'kotlin': '.kt', 'swift': '.swift',
          }

          synced = 0
          for item in reversed(accepted):
              submission_id = str(item.get('id', ''))
              if not submission_id or submission_id in processed:
                  continue

              code = item.get('code')
              slug = item.get('title_slug') or item.get('titleSlug')
              title = item.get('title') or slug or 'LeetCode Problem'
              lang = str(item.get('lang') or '').lower()
              ext = extensions.get(lang)
              qid = str(item.get('question_id') or '')

              if not code or not slug or not ext:
                  print(f'Skipping submission {submission_id}: missing code, slug, or unsupported language ({lang}).')
                  processed.add(submission_id)
                  continue

              safe_slug = re.sub(r'[^a-z0-9]+', '-', slug.lower()).strip('-')
              target = None
              for folder in Path('.').iterdir():
                  if folder.is_dir() and re.match(r'^\d+-', folder.name):
                      if re.sub(r'^\d+-', '', folder.name) == safe_slug:
                          target = folder
                          break

              if target is None:
                  target = Path(f'{qid or submission_id}-{safe_slug}')
              target.mkdir(parents=True, exist_ok=True)

              solution_path = target / f'{safe_slug}{ext}'
              solution_path.write_text(code, encoding='utf-8')

              readme_path = target / 'README.md'
              if not readme_path.exists():
                  readme_path.write_text(
                      f'# {qid + ". " if qid else ""}{title}\n\n'
                      f'**Difficulty:** Unspecified\n\n'
                      f'**Language:** {lang}\n\n'
                      f'**LeetCode:** https://leetcode.com/problems/{slug}/\n\n'
                      'This solution was synced automatically from an accepted LeetCode submission.\n',
                      encoding='utf-8'
                  )

              processed.add(submission_id)
              synced += 1
              print(f'Synced: {qid}. {title} ({lang})')

          state['submission_ids'] = list(processed)[-500:]
          state_path.write_text(json.dumps(state, indent=2), encoding='utf-8')
          print(f'LeetCode sync complete. New submissions synced: {synced}')

      - name: Generate README dashboard
        shell: python
        run: |
          from pathlib import Path
          import re
          from datetime import date

          root = Path('.')
          supported = {'.py', '.java', '.cpp', '.js', '.ts', '.c', '.cs', '.go', '.rs', '.kt', '.swift'}
          problems = []

          for folder in root.iterdir():
              if not folder.is_dir() or not re.match(r'^\d+-', folder.name):
                  continue
              match = re.match(r'^(\d+)-(.*)$', folder.name)
              if not match:
                  continue

              number = int(match.group(1))
              slug = match.group(2)
              readme = folder / 'README.md'
              readme_text = readme.read_text(encoding='utf-8') if readme.exists() else ''
              solution_files = sorted(p for p in folder.iterdir() if p.is_file() and p.suffix.lower() in supported)
              solved = bool(solution_files)

              title = slug.replace('-', ' ').title()
              title_match = re.search(r'^#\s+(?:\d+\.\s*)?(.+)$', readme_text, re.MULTILINE)
              if title_match:
                  title = re.sub(r'^\d+\.\s*', '', title_match.group(1).strip())

              difficulty = 'Unspecified'
              diff_match = re.search(r'(?:Difficulty|Level)\s*[:|\-]\s*(Easy|Medium|Hard)', readme_text, re.I)
              if not diff_match:
                  diff_match = re.search(r'\b(Easy|Medium|Hard)\b', readme_text, re.I)
              if diff_match:
                  difficulty = diff_match.group(1).capitalize()

              language = ', '.join(sorted({p.suffix.lower().lstrip('.') for p in solution_files})) or '—'
              problems.append({'number': number, 'slug': slug, 'title': title, 'difficulty': difficulty, 'solved': solved, 'language': language, 'url': f'https://leetcode.com/problems/{slug}/', 'relative': folder.as_posix()})

          problems.sort(key=lambda x: x['number'])
          total = len(problems)
          solved_count = sum(p['solved'] for p in problems)
          unsolved_count = total - solved_count
          easy = sum(p['difficulty'] == 'Easy' for p in problems)
          medium = sum(p['difficulty'] == 'Medium' for p in problems)
          hard = sum(p['difficulty'] == 'Hard' for p in problems)

          dashboard = '\n'.join([
              '| Metric | Progress |', '|---|---:|',
              f'| Total Problems | **{total}** |', f'| Solved | **{solved_count}** |',
              f'| Unsolved | **{unsolved_count}** |', f'| Easy | **{easy}** |',
              f'| Medium | **{medium}** |', f'| Hard | **{hard}** |', '',
              f'**Last updated:** {date.today().isoformat()}', '',
              '**Daily practice matters more than chasing a number.** The goal is to keep learning, understand patterns, and become a better problem solver one problem at a time.',
          ])

          table = ['| # | Problem | Difficulty | Language | Solution |', '|---:|---|---|---|---|']
          for idx, p in enumerate(problems, start=1):
              badge = {'Easy':'🟢 Easy', 'Medium':'🟡 Medium', 'Hard':'🔴 Hard'}.get(p['difficulty'], '⚪ Unspecified')
              solution = f'[{p["language"]}]({p["relative"]})' if p['solved'] else '—'
              table.append(f'| {idx} | [{p["number"]}. {p["title"]}]({p["url"]}) | {badge} | {p["language"]} | {solution} |')

          readme_path = root / 'README.md'
          text = readme_path.read_text(encoding='utf-8')
          text = re.sub(r'<!-- AUTO-GENERATED:START -->.*?<!-- AUTO-GENERATED:END -->', f'<!-- AUTO-GENERATED:START -->\n\n{dashboard}\n\n<!-- AUTO-GENERATED:END -->', text, flags=re.S)
          text = re.sub(r'<!-- PROBLEM-LIST:START -->.*?<!-- PROBLEM-LIST:END -->', f'<!-- PROBLEM-LIST:START -->\n\n{"\n".join(table)}\n\n<!-- PROBLEM-LIST:END -->', text, flags=re.S)
          readme_path.write_text(text, encoding='utf-8')
          print(f'Generated: total={total}, solved={solved_count}, unsolved={unsolved_count}, easy={easy}, medium={medium}, hard={hard}')

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync LeetCode submissions and progress'
          git push
